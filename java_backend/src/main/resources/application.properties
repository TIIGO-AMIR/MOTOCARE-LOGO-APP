spring.application.name=motorcycle-service-log-backend
server.port=8080

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:motorcycle_service_log.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS configuration for Flutter / Web clients
# Allowed origins for mobile apps & web dashboards
cors.allowed-origins=*
